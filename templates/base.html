<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Chapters{% endblock %}</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">


<style>
    /* ============ Design tokens ============ */
    :root {
        --ink:        #14181F;   /* page background, night-reading */
        --surface:    #1D242E;   /* book-cover panels */
        --surface-2:  #242C38;   /* raised panel */
        --paper:      #F4EFE4;   /* cream paper */
        --paper-dim:  #C9C2B2;   /* muted paper text */
        --amber:      #E3A84B;   /* lamp glow / primary accent */
        --amber-dim:  #8A6428;
        --ember:      #C1502E;   /* streak flame */
        --moss:       #7A9471;   /* quests / success */
        --line:       rgba(244,239,228,0.08);
        --radius:     14px;
    }

    * { box-sizing: border-box; }

    html, body {
        margin: 0;
        padding: 0;
        background: var(--ink);
        color: var(--paper);
        font-family: 'Inter', sans-serif;
        min-height: 100%;
    }

    body {
        background-image:
            radial-gradient(ellipse 900px 500px at 15% -10%, rgba(227,168,75,0.10), transparent 60%),
            radial-gradient(ellipse 700px 500px at 100% 0%, rgba(122,148,113,0.06), transparent 60%);
    }

    h1, h2, h3, .display {
        font-family: 'Fraunces', serif;
        font-weight: 600;
        letter-spacing: -0.01em;
        margin: 0;
    }

    .mono {
        font-family: 'IBM Plex Mono', monospace;
    }

    a { color: inherit; text-decoration: none; }

    /* ============ Top nav ============ */
    .topnav {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 1.25rem 2.5rem;
        border-bottom: 1px solid var(--line);
    }
    .brand {
        display: flex;
        align-items: center;
        gap: 0.6rem;
        font-family: 'Fraunces', serif;
        font-size: 1.25rem;
        font-weight: 700;
        color: var(--paper);
    }
    .brand .brand-mark {
        width: 26px; height: 26px;
        display: inline-flex;
    }
    .navlinks {
        display: flex;
        gap: 2rem;
        font-size: 0.92rem;
        font-weight: 500;
        color: var(--paper-dim);
    }
    .navlinks a { transition: color .15s ease; }
    .navlinks a:hover, .navlinks a.active { color: var(--amber); }

    .navright {
        display: flex;
        align-items: center;
        gap: 1.1rem;
    }
    .membership-pill {
        font-size: 0.72rem;
        font-weight: 600;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        padding: 0.3rem 0.7rem;
        border-radius: 100px;
        border: 1px solid var(--amber-dim);
        color: var(--amber);
    }
    .avatar-btn {
        width: 38px; height: 38px;
        border-radius: 50%;
        background: linear-gradient(145deg, var(--surface-2), var(--surface));
        border: 1px solid var(--line);
        display: flex; align-items: center; justify-content: center;
        font-weight: 600;
        font-size: 0.85rem;
        color: var(--amber);
        cursor: pointer;
    }

    /* ============ Layout ============ */
    .wrap {
        max-width: 1180px;
        margin: 0 auto;
        padding: 2.5rem 2.5rem 4rem;
    }

    .hero-row {
        display: grid;
        grid-template-columns: 1.3fr 1fr 1fr 1fr;
        gap: 1.25rem;
        margin-bottom: 1.25rem;
    }

    .greeting-card {
        background: linear-gradient(160deg, var(--surface-2), var(--surface));
        border: 1px solid var(--line);
        border-radius: var(--radius);
        padding: 1.6rem 1.7rem;
        display: flex;
        flex-direction: column;
        justify-content: center;
    }
    .greeting-card .eyebrow {
        font-size: 0.78rem;
        color: var(--paper-dim);
        margin-bottom: 0.35rem;
    }
    .greeting-card h1 {
        font-size: 1.65rem;
        color: var(--paper);
    }
    .greeting-card .sub {
        margin-top: 0.5rem;
        font-size: 0.88rem;
        color: var(--paper-dim);
    }

    /* Stat cards */
    .stat-card {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        padding: 1.4rem 1.5rem;
        display: flex;
        flex-direction: column;
        gap: 0.55rem;
        position: relative;
        overflow: hidden;
    }
    .stat-label {
        font-size: 0.75rem;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--paper-dim);
    }
    .stat-value {
        font-size: 1.9rem;
        font-family: 'IBM Plex Mono', monospace;
        font-weight: 600;
    }
    .stat-foot {
        font-size: 0.78rem;
        color: var(--paper-dim);
    }

    /* Streak card — lamp glow signature */
    .stat-card.streak .stat-value { color: var(--ember); }
    .stat-card.streak::after {
        content: "";
        position: absolute;
        top: -30px; right: -30px;
        width: 120px; height: 120px;
        background: radial-gradient(circle, rgba(193,80,46,0.35), transparent 70%);
        pointer-events: none;
    }
    .flame-row { display:flex; align-items:center; gap:0.5rem; }
    .flame-icon { width: 20px; height: 20px; flex-shrink:0; }

    .stat-card.coins .stat-value { color: var(--amber); }
    .stat-card.level .stat-value { color: var(--moss); }

    /* ============ XP ribbon (signature element) ============ */
    .xp-panel {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        padding: 1.5rem 1.7rem 1.6rem;
        margin-bottom: 1.75rem;
    }
    .xp-top {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        margin-bottom: 0.9rem;
    }
    .xp-top h3 { font-size: 1.05rem; color: var(--paper); }
    .xp-top .xp-count {
        font-family: 'IBM Plex Mono', monospace;
        font-size: 0.85rem;
        color: var(--paper-dim);
    }
    .xp-top .xp-count strong { color: var(--amber); font-size: 1rem; }

    .ribbon-track {
        position: relative;
        height: 26px;
        background: rgba(244,239,228,0.06);
        border-radius: 4px;
        clip-path: polygon(0 0, calc(100% - 14px) 0, 100% 50%, calc(100% - 14px) 100%, 0 100%);
        overflow: hidden;
    }
    .ribbon-fill {
        position: absolute;
        top: 0; left: 0; bottom: 0;
        width: var(--xp-pct, 45%);
        background: linear-gradient(90deg, var(--amber-dim), var(--amber));
        transition: width 1.1s cubic-bezier(.2,.8,.2,1);
    }
    .ribbon-ticks {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        pointer-events: none;
    }
    .ribbon-ticks span {
        flex: 1;
        border-right: 1px solid rgba(20,24,31,0.35);
        height: 100%;
    }
    .ribbon-ticks span:last-child { border-right: none; }

    /* ============ Main grid ============ */
    .main-grid {
        display: grid;
        grid-template-columns: 2fr 1fr;
        gap: 1.75rem;
        align-items: start;
    }

    .section-head {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        margin-bottom: 1rem;
    }
    .section-head h2 { font-size: 1.2rem; }
    .section-head .link { font-size: 0.85rem; color: var(--amber); }

    /* Continue reading — feature card */
    .continue-card {
        background: linear-gradient(135deg, var(--surface-2), var(--surface));
        border: 1px solid var(--line);
        border-radius: var(--radius);
        padding: 1.5rem;
        display: flex;
        gap: 1.3rem;
        margin-bottom: 1.75rem;
    }
    .book-spine {
        width: 64px;
        height: 88px;
        border-radius: 4px 8px 8px 4px;
        background: linear-gradient(160deg, var(--amber), var(--ember));
        flex-shrink: 0;
        box-shadow: -3px 0 0 rgba(0,0,0,0.25) inset;
    }
    .continue-info { flex: 1; }
    .continue-info .title { font-size: 1.15rem; margin-bottom: 0.2rem; }
    .continue-info .meta { font-size: 0.82rem; color: var(--paper-dim); margin-bottom: 0.8rem; }
    .progress-track {
        height: 8px;
        border-radius: 100px;
        background: rgba(244,239,228,0.08);
        overflow: hidden;
        margin-bottom: 0.5rem;
    }
    .progress-fill {
        height: 100%;
        background: var(--moss);
        width: var(--book-pct, 30%);
    }
    .continue-actions { display: flex; align-items: center; gap: 0.9rem; }

    .btn {
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
        padding: 0.65rem 1.2rem;
        border-radius: 8px;
        font-size: 0.88rem;
        font-weight: 600;
        cursor: pointer;
        border: 1px solid transparent;
        transition: transform .12s ease, filter .12s ease;
    }
    .btn:hover { filter: brightness(1.08); }
    .btn:active { transform: translateY(1px); }
    .btn-primary { background: var(--amber); color: #201404; }
    .btn-ghost { background: transparent; border-color: var(--line); color: var(--paper-dim); }
    .btn-ghost:hover { color: var(--paper); border-color: var(--paper-dim); }
    .btn:disabled, .btn.disabled {
        opacity: 0.45;
        cursor: not-allowed;
        pointer-events: none;
    }

    /* Library grid */
    .library-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 1rem;
        margin-bottom: 2rem;
    }
    .book-card {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 1.1rem;
        display: flex;
        flex-direction: column;
        gap: 0.7rem;
    }
    .book-card .book-spine.small { width: 40px; height: 56px; }
    .book-card .b-title { font-size: 0.92rem; font-weight: 600; }
    .book-card .b-meta { font-size: 0.75rem; color: var(--paper-dim); }

    .upload-card {
        border: 1px dashed var(--line);
        border-radius: 12px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.6rem;
        padding: 1.1rem;
        text-align: center;
        min-height: 150px;
        color: var(--paper-dim);
    }
    .upload-card .plus {
        width: 34px; height: 34px;
        border-radius: 50%;
        border: 1px solid var(--line);
        display: flex; align-items: center; justify-content: center;
        font-size: 1.2rem;
        color: var(--amber);
    }
    .upload-card small { font-size: 0.72rem; }

    .side-panel {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        padding: 1.4rem 1.5rem;
        margin-bottom: 1.5rem;
    }
    .quest-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0.7rem 0;
        border-bottom: 1px solid var(--line);
    }
    .quest-item:last-child { border-bottom: none; }
    .quest-name { font-size: 0.88rem; }
    .quest-name .quest-sub { display:block; font-size: 0.74rem; color: var(--paper-dim); margin-top: 2px; }
    .quest-reward {
        font-family: 'IBM Plex Mono', monospace;
        font-size: 0.8rem;
        color: var(--moss);
        white-space: nowrap;
    }

    .lb-row {
        display: flex;
        align-items: center;
        gap: 0.7rem;
        padding: 0.5rem 0;
        font-size: 0.86rem;
    }
    .lb-rank {
        width: 22px;
        font-family: 'IBM Plex Mono', monospace;
        color: var(--paper-dim);
        font-size: 0.8rem;
    }
    .lb-rank.me { color: var(--amber); font-weight: 700; }
    .lb-name.me { color: var(--amber); font-weight: 600; }
    .lb-score {
        margin-left: auto;
        font-family: 'IBM Plex Mono', monospace;
        font-size: 0.8rem;
        color: var(--paper-dim);
    }

    /* Flash messages */
    .flash-stack { margin-bottom: 1.5rem; display: flex; flex-direction: column; gap: 0.5rem; }
    .flash {
        padding: 0.75rem 1rem;
        border-radius: 8px;
        font-size: 0.88rem;
        border: 1px solid var(--line);
    }
    .flash.success { border-color: rgba(122,148,113,0.4); color: var(--moss); }
    .flash.danger  { border-color: rgba(193,80,46,0.4); color: var(--ember); }

    .quest-reset-btn{
    background: none;
    border: none;
    font-family: 'Inter', sans-serif;
    font-size: 0.85rem;
    color: var(--amber);
    cursor: pointer;
    padding: 0;
}
    .quest-reset-btn:hover{ text-decoration: underline; }
    .quest-reset-btn:disabled{ opacity: 0.5; cursor: not-allowed; text-decoration: none; }

    .profile-menu{ position: relative; }

    .profile-dropdown{
        position: absolute;
        top: calc(100% + 10px);
        right: 0;
        min-width: 160px;
        background: var(--surface-2);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 0.4rem;
        box-shadow: 0 12px 28px -12px rgba(0,0,0,0.6);
        opacity: 0;
        transform: translateY(-6px);
        visibility: hidden;
        pointer-events: none;
        transition: opacity .15s ease, transform .15s ease;
        z-index: 50;
    }
    .profile-dropdown.open{
        opacity: 1;
        transform: translateY(0);
        visibility: visible;
        pointer-events: auto;
    }
    .dropdown-item{
        display: block;
        width: 100%;
        text-align: left;
        padding: 0.55rem 0.7rem;
        border-radius: 6px;
        font-size: 0.86rem;
        color: var(--paper-dim);
        background: none;
        border: none;
        cursor: pointer;
        font-family: 'Inter', sans-serif;
    }
    .dropdown-item:hover{ background: rgba(244,239,228,0.06); color: var(--paper); }
    .dropdown-item-btn{ color: var(--ember); }
    .profile-dropdown form{ margin: 0; }

    @media (prefers-reduced-motion: reduce){
        .profile-dropdown{ transition: none; }
    }
    @media (max-width: 980px) {
        .hero-row { grid-template-columns: 1fr 1fr; }
        .main-grid { grid-template-columns: 1fr; }
        .library-grid { grid-template-columns: 1fr 1fr; }
    }
    @media (max-width: 620px) {
        .wrap { padding: 1.5rem 1.2rem 3rem; }
        .topnav { padding: 1rem 1.2rem; flex-wrap: wrap; gap: 0.8rem; }
        .navlinks { order: 3; width: 100%; justify-content: space-between; gap: 0.5rem; }
        .hero-row { grid-template-columns: 1fr 1fr; }
        .library-grid { grid-template-columns: 1fr; }
        .continue-card { flex-direction: column; }
    }

    @media (prefers-reduced-motion: reduce) {
        .ribbon-fill { transition: none; }
    }

    a:focus-visible, button:focus-visible, .btn:focus-visible {
        outline: 2px solid var(--amber);
        outline-offset: 2px;
    }
</style>

{% block extra_style %}{% endblock %}
</head>
<body>

<nav class="topnav">
    <div class="brand">
        <span class="brand-mark">
            <svg viewBox="0 0 26 26" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M3 5.5C3 4.67 3.67 4 4.5 4H12v18H4.5A1.5 1.5 0 0 1 3 20.5v-15Z" fill="#E3A84B"/>
                <path d="M23 5.5c0-.83-.67-1.5-1.5-1.5H14v18h7.5a1.5 1.5 0 0 0 1.5-1.5v-15Z" fill="#C1502E"/>
                <path d="M12 4h2v18h-2z" fill="#14181F"/>
            </svg>
        </span>
        Chapters
    </div>
    <div class="navlinks">
        <a href="{{ url_for('dashboard') }}" class="{{ 'active' if request.endpoint == 'dashboard' }}">Dashboard</a>
        <a href="{{ url_for('leaderboard_page') }}" class="{{ 'active' if request.endpoint == 'leaderboard_page' }}">Leaderboard</a>
        <a href="{{ url_for('profile') }}" class="{{ 'active' if request.endpoint == 'profile' }}">Profile</a>
        <a href="#">Upgrade</a>
    </div>
    <div class="navright">
        <span class="membership-pill">{{ user.membership | default('Free', true) }}</span>
        <div class="profile-menu">
            <button type="button" class="avatar-btn" id="avatarBtn" aria-haspopup="true" aria-expanded="false" title="{{ user.full_name | default('Reader') }}">
                {{ (user.full_name | default('R'))[0] | upper }}
            </button>
            <div class="profile-dropdown" id="profileDropdown">
                <a href="{{ url_for('profile') }}" class="dropdown-item">Profile</a>
                <form method="POST" action="{{ url_for('logout') }}">
                    <button type="submit" class="dropdown-item dropdown-item-btn">Log out</button>
                </form>
            </div>
        </div>
    </div>
</nav>

<div class="wrap">
{% block content %}{% endblock %}
</div>

<script>
(function(){
    const btn = document.getElementById('avatarBtn');
    const menu = document.getElementById('profileDropdown');
    if(!btn || !menu) return;

    function closeMenu(){
        menu.classList.remove('open');
        btn.setAttribute('aria-expanded', 'false');
    }
    function toggleMenu(e){
        e.stopPropagation();
        const isOpen = menu.classList.toggle('open');
        btn.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
    }

    btn.addEventListener('click', toggleMenu);
    document.addEventListener('click', function(e){
        if(!menu.contains(e.target) && e.target !== btn) closeMenu();
    });
    document.addEventListener('keydown', function(e){
        if(e.key === 'Escape') closeMenu();
    });
})();
</script>
{% block scripts %}{% endblock %}

</body>
</html>
